plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ex2widgets'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.ex2widgets'
        minSdk 28
        targetSdk 29
        versionCode 2
        versionName '1.0.1'
        resConfigs 'ru'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Только заглушки Car API: приложение сознательно без androidx — весь
    // нужный API (уведомления, наложения, цвета из темы) есть в платформе 28+.
    compileOnly project(':car-stubs')
}
